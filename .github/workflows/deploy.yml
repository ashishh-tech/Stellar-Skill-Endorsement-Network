name: Deploy - Stellar Testnet

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Contracts & Web Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Soroban Contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Deploy to Stellar Testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          bash scripts/deploy.sh testnet || echo "Testnet deployment skipped if secret key unconfigured"

      - name: Build Next.js App
        run: npm run build
