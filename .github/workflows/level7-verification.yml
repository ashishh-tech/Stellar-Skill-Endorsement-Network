name: Level 7 Founder Belt Full Automated Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-contracts:
    name: Rust Smart Contracts (Soroban SDK v22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo Test Suite (20 Tests)
        run: cargo test --workspace --verbose

      - name: Compile Optimized WASM Bytecode
        run: cargo build --workspace --target wasm32-unknown-unknown --release

  verify-frontend:
    name: Next.js 15 Frontend & Services Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests (12 Tests)
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: "mainnet"
          NEXT_PUBLIC_PROFILE_REGISTRY_CONTRACT: "CCAGR3Y42J34T3Z5PROFILE3REGISTRY3MAINNET3STELLAR3SOROBAN"
          NEXT_PUBLIC_ENDORSEMENT_ENGINE_CONTRACT: "CCAGR3Y42J34T3Z5ENDORSEMENT3ENGINE3MAINNET3STELLAR3SOROBAN"
