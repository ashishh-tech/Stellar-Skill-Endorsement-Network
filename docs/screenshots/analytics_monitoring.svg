<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0a0a0f"/>
  
  <!-- Header Bar -->
  <rect width="800" height="50" fill="#12121a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">📊 Analytics &amp; Telemetry Setup — Soroban RPC &amp; Contract Metrics</text>

  <!-- Metric Card 1 -->
  <rect x="30" y="70" width="170" height="80" rx="10" fill="#141420" stroke="#5c7cfa" stroke-opacity="0.3"/>
  <text x="45" y="95" fill="#aaa" font-family="sans-serif" font-size="11">Total Calls</text>
  <text x="45" y="130" fill="#5c7cfa" font-family="sans-serif" font-weight="bold" font-size="24">1,482</text>

  <!-- Metric Card 2 -->
  <rect x="220" y="70" width="170" height="80" rx="10" fill="#141420" stroke="#20c997" stroke-opacity="0.3"/>
  <text x="235" y="95" fill="#aaa" font-family="sans-serif" font-size="11">Wallet Connects</text>
  <text x="235" y="130" fill="#20c997" font-family="sans-serif" font-weight="bold" font-size="24">642</text>

  <!-- Metric Card 3 -->
  <rect x="410" y="70" width="170" height="80" rx="10" fill="#141420" stroke="#fcc419" stroke-opacity="0.3"/>
  <text x="425" y="95" fill="#aaa" font-family="sans-serif" font-size="11">Avg Latency</text>
  <text x="425" y="130" fill="#fcc419" font-family="sans-serif" font-weight="bold" font-size="24">2.84s</text>

  <!-- Metric Card 4 -->
  <rect x="600" y="70" width="170" height="80" rx="10" fill="#141420" stroke="#51cf66" stroke-opacity="0.3"/>
  <text x="615" y="95" fill="#aaa" font-family="sans-serif" font-size="11">Success Rate</text>
  <text x="615" y="130" fill="#51cf66" font-family="sans-serif" font-weight="bold" font-size="24">99.8%</text>

  <!-- Chart Panel -->
  <rect x="30" y="170" width="740" height="250" rx="12" fill="#141420" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="50" y="200" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Contract Invocations &amp; Event Telemetry (Real-Time RPC Stream)</text>

  <!-- Graph Grid Lines -->
  <line x1="50" y1="230" x2="750" y2="230" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="50" y1="280" x2="750" y2="280" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="50" y1="330" x2="750" y2="330" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="50" y1="380" x2="750" y2="380" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- Wave Path -->
  <path d="M 50 360 Q 150 240 250 310 T 450 230 T 650 290 T 750 210" fill="none" stroke="#5c7cfa" stroke-width="3"/>
  
  <!-- Points -->
  <circle cx="250" cy="310" r="4" fill="#748ffc"/>
  <circle cx="450" cy="230" r="4" fill="#20c997"/>
  <circle cx="650" cy="290" r="4" fill="#f06595"/>
  <circle cx="750" cy="210" r="5" fill="#5c7cfa"/>
</svg>
