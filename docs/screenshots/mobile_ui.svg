<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 700" width="100%" height="100%">
  <rect width="380" height="700" rx="30" fill="#0a0a0f" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
  
  <!-- Mobile Header -->
  <rect x="10" y="20" width="360" height="50" rx="10" fill="#12121a"/>
  <rect x="25" y="32" width="25" height="25" rx="6" fill="#5c7cfa"/>
  <text x="58" y="49" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">Skill<tspan fill="#748ffc">Net</tspan></text>
  
  <rect x="230" y="30" width="130" height="30" rx="8" fill="#5c7cfa"/>
  <text x="245" y="50" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Connect Wallet</text>

  <!-- Mobile Hero -->
  <text x="25" y="110" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Trust-Weighted</text>
  <text x="25" y="138" fill="#ff6b35" font-family="sans-serif" font-weight="bold" font-size="22">Skill Endorsements</text>
  <text x="25" y="165" fill="#aaa" font-family="sans-serif" font-size="12">Build your on-chain reputation graph on Stellar.</text>

  <!-- Stats Grid -->
  <rect x="25" y="195" width="155" height="75" rx="10" fill="#1a1a25" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="35" y="220" fill="#888" font-family="sans-serif" font-size="11">Reputation Score</text>
  <text x="35" y="250" fill="#ff6b35" font-family="sans-serif" font-weight="bold" font-size="20">150 PTS</text>

  <rect x="195" y="195" width="160" height="75" rx="10" fill="#1a1a25" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="205" y="220" fill="#888" font-family="sans-serif" font-size="11">Testnet Gas</text>
  <text x="205" y="250" fill="#f59f00" font-family="sans-serif" font-weight="bold" font-size="18">10,000 XLM</text>

  <!-- Mobile Feed Card -->
  <rect x="25" y="290" width="330" height="370" rx="12" fill="#12121a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="320" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Live Activity Feed</text>
  
  <rect x="40" y="340" width="300" height="60" rx="8" fill="#1a1a25"/>
  <text x="50" y="365" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">🤝 Skill Endorsed</text>
  <text x="50" y="385" fill="#888" font-family="monospace" font-size="10">Soroban • Weight: 15 PTS</text>

  <rect x="40" y="415" width="300" height="60" rx="8" fill="#1a1a25"/>
  <text x="50" y="440" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">📝 Profile Registered</text>
  <text x="50" y="460" fill="#888" font-family="monospace" font-size="10">Alice • Base: 100 PTS</text>

  <rect x="40" y="490" width="300" height="60" rx="8" fill="#1a1a25"/>
  <text x="50" y="515" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">🎯 Skill Added</text>
  <text x="50" y="535" fill="#888" font-family="monospace" font-size="10">Rust • Category: Coding</text>

  <!-- Mobile Bottom Nav -->
  <rect x="25" y="615" width="330" height="35" rx="10" fill="#5c7cfa"/>
  <text x="140" y="638" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Explore Activity</text>
</svg>
