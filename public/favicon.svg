<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c7cfa"/>
      <stop offset="50%" stop-color="#748ffc"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c7cfa" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4c6ef5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="54" stroke="url(#rg)" stroke-width="2.5" fill="#0a0a0f"/>

  <!-- Network lines -->
  <g stroke="url(#fg)" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="60" y1="60" x2="35" y2="32"/>
    <line x1="60" y1="60" x2="88" y2="35"/>
    <line x1="60" y1="60" x2="90" y2="72"/>
    <line x1="60" y1="60" x2="32" y2="78"/>
    <line x1="60" y1="60" x2="60" y2="95"/>
    <line x1="35" y1="32" x2="88" y2="35"/>
    <line x1="88" y1="35" x2="90" y2="72"/>
    <line x1="90" y1="72" x2="60" y2="95"/>
    <line x1="60" y1="95" x2="32" y2="78"/>
    <line x1="32" y1="78" x2="35" y2="32"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="35" cy="32" r="7" fill="#1a1a25" stroke="url(#fg)" stroke-width="2.5"/>
  <circle cx="35" cy="32" r="3" fill="#5c7cfa"/>
  <circle cx="88" cy="35" r="7" fill="#1a1a25" stroke="url(#fg)" stroke-width="2.5"/>
  <circle cx="88" cy="35" r="3" fill="#748ffc"/>
  <circle cx="90" cy="72" r="7" fill="#1a1a25" stroke="url(#fg)" stroke-width="2.5"/>
  <circle cx="90" cy="72" r="3" fill="#ff6b35"/>
  <circle cx="60" cy="95" r="7" fill="#1a1a25" stroke="url(#fg)" stroke-width="2.5"/>
  <circle cx="60" cy="95" r="3" fill="#f59f00"/>
  <circle cx="32" cy="78" r="7" fill="#1a1a25" stroke="url(#fg)" stroke-width="2.5"/>
  <circle cx="32" cy="78" r="3" fill="#20c997"/>

  <!-- Central hub -->
  <circle cx="60" cy="60" r="14" fill="#1a1a25" stroke="url(#fg)" stroke-width="3"/>
  <circle cx="60" cy="60" r="8" fill="url(#fg)" opacity="0.9"/>
  <circle cx="60" cy="60" r="4" fill="white" opacity="0.9"/>
</svg>
